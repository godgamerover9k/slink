# Render reads this and builds a free web service that serves both the page
# and the rooms from one address.
#
#   On Render: New -> Blueprint -> pick this repository.
#
# It is open by default: anyone with the address can make a room and join one.
# To make it private instead, delete SLINK_OPEN and set SLINK_KEY to a phrase
# of your own; the address then only works with ?k=your-phrase on the end.
services:
  - type: web
    name: slitherlink-plot-room
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node slink-server.js
    envVars:
      - key: SLINK_OPEN
        value: "1"           # anyone may make and join rooms
      - key: SLINK_MAX_ROOMS
        value: "300"         # oldest rooms drop off past this
      - key: NODE_VERSION
        value: "22"
